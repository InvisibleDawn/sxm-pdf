# Compile SXM PDF sur les serveurs de GitHub.
# Depuis le 16/11 : Windows + Fedora (.rpm) seulement (environ 25 min). Pour réactiver ponctuellement le Mac
# ou le .deb, mettre « [mac] » et/ou « [deb] » dans le message du dernier commit envoyé.
# Lancement : à chaque tag "v*" (ex. v1.0.0) ou manuellement (onglet Actions > Run workflow).
name: Compiler SXM PDF

on:
  workflow_dispatch:
  push:
    branches: [main, publier]   # main : tests seuls (rapide) ; publier : tests + installateurs + page Releases
    tags: ["v*"]       # à chaque version : tests + installateurs

jobs:
  # 1) Tests de fiabilité de la sauvegarde sur les trois systèmes — rapide, sans LibreOffice.
  tests:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel : les Mac Apple Silicon de GitHub sont souvent indisponibles (file d'attente)
        os: ${{ fromJSON(contains(github.event.head_commit.message, '[mac]') && '["windows-latest","macos-15-intel","ubuntu-22.04","ubuntu-24.04"]' || '["windows-latest","ubuntu-22.04","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Dépendances Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev qpdf
      - name: qpdf pour les tests (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install qpdf
      - run: npm ci
      - name: Tests JavaScript (nettoyage des PDF, masquage)
        run: npm test
      - name: Tests de l'interface (fonctions PDF dans Chrome sans écran)
        if: startsWith(matrix.os, 'ubuntu')
        run: npm run test:e2e
      - name: Tests Rust (sauvegarde des données, écriture des PDF, chiffrement)
        shell: bash
        run: |
          npm run build
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1 2>&1 | tee test-results.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # un incident d'envoi chez GitHub ne doit pas faire échouer des tests réussis
        with:
          name: resultats-tests-${{ matrix.os }}
          path: test-results.txt

  # 0) Dépendances : fichiers de verrouillage cohérents et aucune vulnérabilité connue
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package-lock.json cohérent avec package.json
        run: npm ci --ignore-scripts
      - name: Vulnérabilités npm (élevées ou critiques = échec)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo.lock cohérent avec Cargo.toml
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Vulnérabilités Rust (RustSec)
        run: cd src-tauri && cargo audit

  # 1 ter) Mac Apple Silicon (arm64) : tests. Machines GitHub parfois indisponibles : ce test ne bloque
  # pas les installateurs, mais son résultat est visible dans la compilation.
  tests-mac-arm:
    if: contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install qpdf
      - run: npm ci
      - run: npm test
      - name: Tests Rust (arm64)
        run: |
          npm run build
          uname -m
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  # 1 quater) Debian 13 : tests, paquet .deb installé avec apt et lancé.
  debian:
    if: contains(github.event.head_commit.message, '[deb]')
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Dépendances Debian
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates build-essential file pkg-config libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev qpdf xvfb dbus-x11 xz-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Tests Rust
        run: |
          npm run build
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Paquet .deb
        run: npx tauri build --bundles deb -- --locked
      - name: Installation et démarrage sur Debian 13
        run: |
          apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99
          dbus-launch sxm-pdf > app.log 2>&1 & PID=$!
          sleep 15
          cat app.log || true
          kill -0 $PID
          kill $PID

  # 1 bis) Fedora 45 : tests, paquet .rpm construit sur Fedora, installation et lancement de l'appli.
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 60
    steps:
      - name: Dépendances Fedora
        run: dnf -y install git gcc gcc-c++ make curl file openssl-devel webkit2gtk4.1-devel librsvg2-devel nodejs npm rpm-build qpdf xorg-x11-server-Xvfb dbus-x11
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Tests JavaScript
        run: npm test
      - name: Tests Rust
        run: |
          npm run build
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Paquet .rpm
        run: npx tauri build --bundles rpm -- --locked
      - name: Installation et démarrage sur Fedora
        run: |
          dnf -y install ./src-tauri/target/release/bundle/rpm/*.rpm
          rpm -q sxm-pdf
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99
          dbus-launch sxm-pdf > app.log 2>&1 & PID=$!
          sleep 15
          cat app.log || true
          kill -0 $PID   # l'application tourne toujours après 15 s
          kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: sxm-pdf-fedora-45
          path: src-tauri/target/release/bundle/rpm/*.rpm

  # 2) Installateurs — seulement si les tests passent, au lancement manuel ou sur un tag de version.
  build:
    needs: [audit, tests, fedora]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/publier'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Windows toujours ; Mac avec « [mac] », .deb avec « [deb] » (le .rpm vient du job fedora).
        include: ${{ fromJSON(format('[{{"os":"windows-latest","bundles":"msi,nsis"}}{0}{1}]',
          contains(github.event.head_commit.message, '[mac]') && ',{"os":"macos-15-intel","bundles":"app,dmg"}' || '',
          contains(github.event.head_commit.message, '[deb]') && ',{"os":"ubuntu-22.04","bundles":"deb"}' || '')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Dépendances Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # LibreOffice embarqué pour Windows (conversions Office hors ligne)
      # qpdf (petit) puis LibreOffice (≈350 Mo). Limités dans le temps : si l'embarquement échoue,
      # l'installateur est produit sans LibreOffice (l'application l'indique alors à l'utilisateur).
      - name: Embarquer qpdf (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Binaire officiel publié par le projet qpdf (github.com/qpdf/qpdf), sans installation système
          gh release download --repo qpdf/qpdf --pattern "qpdf-*-msvc64.zip" --dir $env:RUNNER_TEMP --clobber
          $zip = Get-ChildItem "$env:RUNNER_TEMP\qpdf-*-msvc64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\qpdfx" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\qpdfx" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/qpdf | Out-Null
          Copy-Item -Recurse "$($root.FullName)\*" src-tauri/qpdf/
          if (!(Test-Path src-tauri/qpdf/bin/qpdf.exe)) { throw "qpdf.exe introuvable dans l'archive" }
          & src-tauri/qpdf/bin/qpdf.exe --version
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.resources | Add-Member -NotePropertyName "qpdf/" -NotePropertyValue "qpdf/" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Embarquer LibreOffice (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 30
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress --execution-timeout=1500
          New-Item -ItemType Directory -Force src-tauri/libreoffice | Out-Null
          Copy-Item -Recurse "C:\Program Files\LibreOffice\*" src-tauri/libreoffice/
          # Ajouté aux ressources existantes (licences) sans les écraser, seulement si la copie a réussi
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.resources | Add-Member -NotePropertyName "libreoffice/" -NotePropertyValue "libreoffice/" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Embarquer qpdf (macOS)
        if: startsWith(matrix.os, 'macos')
        timeout-minutes: 15
        run: |
          # qpdf (protection par mot de passe) et ses bibliothèques copiés dans l'application :
          # le client n'a rien à installer. Version x86_64 (comme LibreOffice : Rosetta sur Apple Silicon).
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install qpdf dylibbundler
          mkdir -p src-tauri/qpdf/bin src-tauri/qpdf/lib
          cp "$(brew --prefix qpdf)/bin/qpdf" src-tauri/qpdf/bin/qpdf
          chmod u+w src-tauri/qpdf/bin/qpdf
          # Chemins de recherche fournis et entrée fermée : dylibbundler ne doit jamais attendre une saisie
          SEARCH=""; for d in "$(brew --prefix)/lib" "$(brew --prefix)"/opt/*/lib; do SEARCH="$SEARCH -s $d"; done
          dylibbundler -od -b -x src-tauri/qpdf/bin/qpdf -d src-tauri/qpdf/lib -p @executable_path/../lib/ $SEARCH < /dev/null
          codesign --force -s - src-tauri/qpdf/lib/*.dylib src-tauri/qpdf/bin/qpdf
          otool -L src-tauri/qpdf/bin/qpdf
          # Aucune dépendance vers Homebrew ne doit rester
          if otool -L src-tauri/qpdf/bin/qpdf src-tauri/qpdf/lib/*.dylib | grep -E "/usr/local/(opt|Cellar)|/opt/homebrew"; then exit 1; fi
          brew uninstall --ignore-dependencies qpdf
          src-tauri/qpdf/bin/qpdf --version
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.bundle.resources={...(c.bundle.resources||{}),'qpdf/':'qpdf/'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Embarquer LibreOffice (macOS)
        if: startsWith(matrix.os, 'macos')
        timeout-minutes: 30
        run: |
          # Téléchargement direct sur le site officiel (le lien Homebrew était périmé).
          # Version x86_64 : fonctionne sur Mac Intel et, via Rosetta, sur Mac Apple Silicon.
          set -e
          BASE=https://download.documentfoundation.org/libreoffice/stable
          for V in $(curl -fsSL "$BASE/" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -Vr | uniq); do
            URL="$BASE/$V/mac/x86_64/LibreOffice_${V}_MacOS_x86-64.dmg"
            if curl -fL --retry 3 -o "$RUNNER_TEMP/lo.dmg" "$URL"; then echo "LibreOffice $V"; break; fi
          done
          test -s "$RUNNER_TEMP/lo.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/lo" "$RUNNER_TEMP/lo.dmg"
          cp -R "$RUNNER_TEMP/lo/LibreOffice.app" src-tauri/LibreOffice.app
          hdiutil detach "$RUNNER_TEMP/lo"
          test -x src-tauri/LibreOffice.app/Contents/MacOS/soffice
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.bundle.resources={...(c.bundle.resources||{}),'LibreOffice.app/':'LibreOffice.app/'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      # Sur un tag v1.2.3 : la version de l'application = celle du tag, et les fichiers
      # de mise à jour signés sont produits (clé dans les secrets du dépôt).
      - name: Version et mises à jour
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/publier'
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.env.GITHUB_REF_TYPE==='tag'?process.env.GITHUB_REF_NAME.replace(/^v/,''):require('./package.json').version;if(process.env.HAS_KEY==='true')c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log('version',c.version,'maj',!!c.bundle.createUpdaterArtifacts)"

      - run: npm ci
      - name: Compiler
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          B="${{ matrix.bundles }}"
          # Le format .msi refuse les versions de test (« 1.4.0-beta ») : seulement .exe dans ce cas.
          T="$GITHUB_REF_NAME"; [ "$GITHUB_REF_TYPE" = tag ] || T="v$(node -p "require('./package.json').version")"
          case "$T" in v*-*) B="${B/msi,/}" ;; esac
          npx tauri build --bundles "$B" ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }} -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: sxm-pdf-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/deb/*.deb

  # 3) Sur un tag : page de téléchargement + fichier de mise à jour lu par l'application.
  #    v1.4.0 (sans tiret) = version stable → tous les utilisateurs.
  #    v1.4.0-beta.1 / v1.4.0-test = version de test → seulement ceux qui ont coché « bêta ».
  publier:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/publier'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sxm-pdf-*
          path: artefacts
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Envoi sur la branche « publier » : nom de version lu dans package.json, tag créé ici.
          if [ "$GITHUB_REF_TYPE" = tag ]; then CIBLE="--verify-tag"; else TAG="v$(node -p "require('./package.json').version")"; CIBLE="--target $GITHUB_SHA"; fi
          echo "Version publiée : $TAG"
          mkdir fichiers
          find artefacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.rpm" -o -name "*.deb" -o -name "*.sig" -o -name "*.app.tar.gz" \) -not -path "*fedora*" -exec cp {} fichiers/ \;
          # .rpm construit et testé sur Fedora 45 : nom distinct
          find artefacts -path "*fedora*" -name "*.rpm" -print0 | while IFS= read -r -d '' f; do cp "$f" "fichiers/$(basename "${f%.rpm}")-fedora45.rpm"; done
          cd fichiers
          for f in *; do n="$(echo "$f" | tr ' ' '-')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls -lh
          VERSION="${TAG#v}"
          case "$TAG" in *-*) PRE=--prerelease; STABLE=0 ;; *) PRE=""; STABLE=1 ;; esac
          # Nouveautés = première section de CHANGELOG.md
          awk '/^## /{n++} n==1' ../CHANGELOG.md | tail -n +2 | head -c 4000 > ../notes.txt
          # Fichier lu par l'application (signatures incluses)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          node - "$VERSION" "$BASE" <<'JS'
          const fs = require("fs");
          const [version, base] = process.argv.slice(2);
          const files = fs.readdirSync(".");
          const pick = (re) => files.find((f) => re.test(f));
          const entry = (f) => f && fs.existsSync(f + ".sig") ? { url: `${base}/${f}`, signature: fs.readFileSync(f + ".sig", "utf8").trim() } : null;
          const platforms = {};
          const win = entry(pick(/-setup\.exe$/));
          if (win) platforms["windows-x86_64"] = win;
          const mac = entry(pick(/\.app\.tar\.gz$/));
          if (mac) { platforms["darwin-x86_64"] = mac; platforms["darwin-aarch64"] = mac; }
          if (!Object.keys(platforms).length) console.log("Pas de fichiers signés : secrets TAURI_SIGNING_* absents ? (Windows/Mac sans mise à jour)");
          // Linux (.rpm Fedora) : l'app prévient seulement et ouvre la page de téléchargement (pas d'installation
          // par l'app), d'où une signature factice ; présent même sans les secrets.
          const rpm = pick(/-fedora45\.rpm$/) || pick(/\.rpm$/);
          if (rpm) platforms["linux-x86_64"] = { url: `${base}/${rpm}`, signature: "telechargement-manuel" };
          if (!Object.keys(platforms).length) process.exit(0);
          const notes = fs.readFileSync("../notes.txt", "utf8").trim();
          fs.writeFileSync("latest.json", JSON.stringify({ version, notes, pub_date: new Date().toISOString(), platforms }, null, 2));
          console.log(fs.readFileSync("latest.json", "utf8"));
          JS
          # Sommes de contrôle : chacun peut vérifier que son fichier n'a pas été altéré
          sha256sum $(ls | grep -v -e '\.sig$' -e '^latest\.json$') > SHA256SUMS.txt
          cp ../notes.txt ../notes-page.txt
          cat >> ../notes-page.txt <<'TXT'

          ---
          Mac : clic droit > Ouvrir au premier lancement ; si « endommagé » : xattr -cr "/Applications/SXM PDF.app".
          Windows : SmartScreen > Informations complémentaires > Exécuter quand même.
          Vérification : sha256sum -c SHA256SUMS.txt
          TXT
          sed -i 's/^          //' ../notes-page.txt
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" $CIBLE $PRE \
            --title "SXM PDF $VERSION" --notes-file ../notes-page.txt
          # Canal bêta : toujours la dernière version publiée (test ou stable)
          if [ -f latest.json ]; then
            cp latest.json beta.json
            gh release view canal-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create canal-beta --repo "$GITHUB_REPOSITORY" --target main --prerelease \
                --title "Canal bêta (technique)" --notes "Fichier lu par SXM PDF pour proposer les versions de test. Ne pas supprimer."
            gh release upload canal-beta beta.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
