# Compile SXM PDF pour Windows, macOS et Linux sur les serveurs de GitHub.
# Lancement : à chaque tag "v*" (ex. v1.0.0) ou manuellement (onglet Actions > Run workflow).
name: Compiler SXM PDF

on:
  workflow_dispatch:
  push:
    branches: [main]   # à chaque envoi : tests seuls (rapide)
    tags: ["v*"]       # à chaque version : tests + installateurs

jobs:
  # 1) Tests de fiabilité de la sauvegarde sur les trois systèmes — rapide, sans LibreOffice.
  tests:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel : les Mac Apple Silicon de GitHub sont souvent indisponibles (file d'attente)
        os: [windows-latest, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Dépendances Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci || npm install
      - name: Tests Rust (sauvegarde des données)
        shell: bash
        run: |
          npm run build
          cargo test --release --manifest-path src-tauri/Cargo.toml -- --test-threads=1 2>&1 | tee test-results.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests-${{ matrix.os }}
          path: test-results.txt

  # 2) Installateurs — seulement si les tests passent, au lancement manuel ou sur un tag de version.
  build:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-15-intel
            bundles: app,dmg   # « app » produit l'archive .app.tar.gz des mises à jour
          - os: ubuntu-22.04
            bundles: rpm,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Dépendances Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # LibreOffice embarqué pour Windows (conversions Office hors ligne)
      # qpdf (petit) puis LibreOffice (≈350 Mo). Limités dans le temps : si l'embarquement échoue,
      # l'installateur est produit sans LibreOffice (l'application l'indique alors à l'utilisateur).
      - name: Embarquer qpdf (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Binaire officiel publié par le projet qpdf (github.com/qpdf/qpdf), sans installation système
          gh release download --repo qpdf/qpdf --pattern "qpdf-*-msvc64.zip" --dir $env:RUNNER_TEMP --clobber
          $zip = Get-ChildItem "$env:RUNNER_TEMP\qpdf-*-msvc64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\qpdfx" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\qpdfx" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/qpdf | Out-Null
          Copy-Item -Recurse "$($root.FullName)\*" src-tauri/qpdf/
          if (!(Test-Path src-tauri/qpdf/bin/qpdf.exe)) { throw "qpdf.exe introuvable dans l'archive" }
          & src-tauri/qpdf/bin/qpdf.exe --version
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.resources | Add-Member -NotePropertyName "qpdf/" -NotePropertyValue "qpdf/" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Embarquer LibreOffice (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 30
        continue-on-error: true
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress --execution-timeout=1500
          New-Item -ItemType Directory -Force src-tauri/libreoffice | Out-Null
          Copy-Item -Recurse "C:\Program Files\LibreOffice\*" src-tauri/libreoffice/
          # Ajouté aux ressources existantes (licences) sans les écraser, seulement si la copie a réussi
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.resources | Add-Member -NotePropertyName "libreoffice/" -NotePropertyValue "libreoffice/" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Embarquer LibreOffice (macOS)
        if: startsWith(matrix.os, 'macos')
        timeout-minutes: 30
        continue-on-error: true
        run: |
          # Téléchargement direct sur le site officiel (le lien Homebrew était périmé).
          # Version x86_64 : fonctionne sur Mac Intel et, via Rosetta, sur Mac Apple Silicon.
          set -e
          BASE=https://download.documentfoundation.org/libreoffice/stable
          for V in $(curl -fsSL "$BASE/" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -Vr | uniq); do
            URL="$BASE/$V/mac/x86_64/LibreOffice_${V}_MacOS_x86-64.dmg"
            if curl -fL --retry 3 -o "$RUNNER_TEMP/lo.dmg" "$URL"; then echo "LibreOffice $V"; break; fi
          done
          test -s "$RUNNER_TEMP/lo.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/lo" "$RUNNER_TEMP/lo.dmg"
          cp -R "$RUNNER_TEMP/lo/LibreOffice.app" src-tauri/LibreOffice.app
          hdiutil detach "$RUNNER_TEMP/lo"
          test -x src-tauri/LibreOffice.app/Contents/MacOS/soffice
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.bundle.resources={...(c.bundle.resources||{}),'LibreOffice.app/':'LibreOffice.app/'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      # Sur un tag v1.2.3 : la version de l'application = celle du tag, et les fichiers
      # de mise à jour signés sont produits (clé dans les secrets du dépôt).
      - name: Version et mises à jour
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(process.env.HAS_KEY==='true')c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log('version',c.version,'maj',!!c.bundle.createUpdaterArtifacts)"

      - run: npm ci || npm install
      - name: Compiler
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          B="${{ matrix.bundles }}"
          # Le format .msi refuse les versions de test (« 1.4.0-beta ») : seulement .exe dans ce cas.
          case "$GITHUB_REF_NAME" in v*-*) B="${B/msi,/}" ;; esac
          npx tauri build --bundles "$B" ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sxm-pdf-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/deb/*.deb

  # 3) Sur un tag : page de téléchargement + fichier de mise à jour lu par l'application.
  #    v1.4.0 (sans tiret) = version stable → tous les utilisateurs.
  #    v1.4.0-beta.1 / v1.4.0-test = version de test → seulement ceux qui ont coché « bêta ».
  publier:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sxm-pdf-*
          path: artefacts
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir fichiers
          find artefacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.rpm" -o -name "*.deb" -o -name "*.sig" -o -name "*.app.tar.gz" \) -exec cp {} fichiers/ \;
          cd fichiers
          for f in *; do n="$(echo "$f" | tr ' ' '-')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls -lh
          VERSION="${TAG#v}"
          case "$TAG" in *-*) PRE=--prerelease; STABLE=0 ;; *) PRE=""; STABLE=1 ;; esac
          # Nouveautés = première section de CHANGELOG.md
          awk '/^## /{n++} n==1' ../CHANGELOG.md | tail -n +2 | head -c 4000 > ../notes.txt
          # Fichier lu par l'application (signatures incluses)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          node - "$VERSION" "$BASE" <<'JS'
          const fs = require("fs");
          const [version, base] = process.argv.slice(2);
          const files = fs.readdirSync(".");
          const pick = (re) => files.find((f) => re.test(f));
          const entry = (f) => f && fs.existsSync(f + ".sig") ? { url: `${base}/${f}`, signature: fs.readFileSync(f + ".sig", "utf8").trim() } : null;
          const platforms = {};
          const win = entry(pick(/-setup\.exe$/));
          if (win) platforms["windows-x86_64"] = win;
          const mac = entry(pick(/\.app\.tar\.gz$/));
          if (mac) { platforms["darwin-x86_64"] = mac; platforms["darwin-aarch64"] = mac; }
          if (!Object.keys(platforms).length) { console.log("Pas de fichiers signés : secrets TAURI_SIGNING_* absents ?"); process.exit(0); }
          const notes = fs.readFileSync("../notes.txt", "utf8").trim();
          fs.writeFileSync("latest.json", JSON.stringify({ version, notes, pub_date: new Date().toISOString(), platforms }, null, 2));
          console.log(fs.readFileSync("latest.json", "utf8"));
          JS
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --verify-tag $PRE \
            --title "SXM PDF $VERSION" --notes-file ../notes.txt
          # Canal bêta : toujours la dernière version publiée (test ou stable)
          if [ -f latest.json ]; then
            cp latest.json beta.json
            gh release view canal-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create canal-beta --repo "$GITHUB_REPOSITORY" --target main --prerelease \
                --title "Canal bêta (technique)" --notes "Fichier lu par SXM PDF pour proposer les versions de test. Ne pas supprimer."
            gh release upload canal-beta beta.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
