# Publie les installateurs d'une compilation réussie sur une page « Releases » (téléchargement direct).
name: Publier les installateurs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro de la compilation (run) à publier"
        required: true
      tag:
        description: "Nom de la version"
        required: true
        default: "v1.0.0-test"

permissions:
  contents: write
  actions: read

jobs:
  publier:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: sxm-pdf-*
          path: artefacts
      - name: Créer la page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir fichiers
          find artefacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.rpm" -o -name "*.deb" \) -not -path "*fedora*" -exec cp {} fichiers/ \;
          # .rpm construit et testé sur Fedora 45 : nom distinct
          find artefacts -path "*fedora*" -name "*.rpm" -print0 | while IFS= read -r -d '' f; do cp "$f" "fichiers/$(basename "${f%.rpm}")-fedora45.rpm"; done
          cd fichiers
          for f in *; do mv "$f" "$(echo "$f" | tr ' ' '-')"; done
          # Sommes de contrôle : chacun peut vérifier que son fichier n'a pas été altéré
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
          gh release delete "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ inputs.tag }}" * --repo "$GITHUB_REPOSITORY" --target "${{ github.ref_name }}" --prerelease \
            --title "SXM PDF ${{ inputs.tag }} — version de test" \
            --notes "Installateurs de test (non signés). Tests automatiques validés sur Windows, macOS, Ubuntu 22.04/24.04, Debian 13 et Fedora 45. Détail des changements : CHANGELOG.md.
          Vérification : sha256sum -c SHA256SUMS.txt (Linux/macOS : shasum -a 256 -c SHA256SUMS.txt ; Windows : Get-FileHash).
          Mac : clic droit > Ouvrir au premier lancement ; si « endommagé » : xattr -cr \"/Applications/SXM PDF.app\".
          Windows : SmartScreen > Informations complémentaires > Exécuter quand même."
