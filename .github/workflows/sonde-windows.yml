# Diagnostic : lance la VRAIE application sous Windows (WebView2) et teste la sélection de texte
# avec la souris simulée (WebDriver) et la vraie souris de Windows. Résultats : artefact « sonde-windows ».
name: Sonde Windows (sélection)

on:
  workflow_dispatch:
  push:
    branches: [sonde-windows]   # lancement : git push origin HEAD:sonde-windows

jobs:
  sonde:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Application (debug, port de débogage WebView2 ouvert — copie de test seulement)
        run: |
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.app.windows[0].additionalBrowserArgs='--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx tauri build --debug --no-bundle
      - name: Sonde (application réelle, WebView2)
        shell: pwsh
        run: |
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Write-Host "WebView2 : $v"
          node tests/windows/fabrique-pdf.mjs "$env:RUNNER_TEMP\pdf"
          node tests/windows/sonde-selection.mjs "$pwd\src-tauri\target\debug\sxm-pdf.exe" "$env:RUNNER_TEMP\pdf\texte.pdf" "$env:RUNNER_TEMP\pdf\scan.pdf"
