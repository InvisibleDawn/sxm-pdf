[package]
name = "sxm-pdf"
version = "1.3.2"
description = "SXM PDF - lecteur, annotation, signature, conversion et capture"
authors = ["Invisible_Dawn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Noms de fichiers temporaires aléatoires (déjà présent dans les dépendances de Tauri)
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
